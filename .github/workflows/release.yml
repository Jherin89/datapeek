name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon. macos-13 is retired; macos-15-intel
          # is the hosted x86_64 macOS runner, so that target is a native build.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Unix archives stay tar.gz. The Windows asset must be a real zip:
      # Git for Windows ships GNU tar, and `tar -a` does not treat `.zip` as
      # zip, so it writes an uncompressed tar that unzip and Expand-Archive reject.
      - name: Package Unix
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          stage="datapeek-${tag}-${target}"
          mkdir -p "dist/${stage}"
          cp README.md LICENSE "dist/${stage}/"
          cp "target/${target}/release/datapeek" "dist/${stage}/datapeek"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          # Read the full listing. grep -q exits early; GNU tar then fails the
          # pipe with "stdout: write error" (exit 2) under pipefail.
          tar -tzf "dist/${stage}.tar.gz" | grep -x "${stage}/datapeek" >/dev/null
          rm -rf "dist/${stage}"

      - name: Package Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $target = '${{ matrix.target }}'
          $stage = "datapeek-$tag-$target"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item README.md, LICENSE -Destination "dist/$stage/"
          Copy-Item "target/$target/release/datapeek.exe" -Destination "dist/$stage/datapeek.exe"

          # 7-Zip is preinstalled on GitHub-hosted Windows runners. -mm=Deflate
          # keeps the archive readable by Expand-Archive and by unzip.
          $seven = $null
          $cmd = Get-Command 7z -ErrorAction SilentlyContinue
          if ($cmd) { $seven = $cmd.Source }
          if (-not $seven) {
            $candidate = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (Test-Path -LiteralPath $candidate) { $seven = $candidate }
          }
          if (-not $seven) { throw '7z not found on PATH or under Program Files\7-Zip' }

          Push-Location dist
          try {
            & $seven a -tzip -mm=Deflate -mx=9 -bd -bso1 -bsp0 "$stage.zip" $stage
            if ($LASTEXITCODE -ne 0) { throw "7z a failed with exit $LASTEXITCODE" }
            & $seven t -bso1 -bsp0 "$stage.zip"
            if ($LASTEXITCODE -ne 0) { throw "7z t failed with exit $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $zipPath = Join-Path (Get-Location) "dist/$stage.zip"
          $bytes = [System.IO.File]::ReadAllBytes($zipPath)
          $isZip = ($bytes.Length -ge 4) -and
            ($bytes[0] -eq 0x50) -and ($bytes[1] -eq 0x4B) -and
            ($bytes[2] -eq 0x03) -and ($bytes[3] -eq 0x04)
          if (-not $isZip) {
            $shown = if ($bytes.Length -ge 4) { [System.BitConverter]::ToString($bytes, 0, 4) } else { 'file shorter than 4 bytes' }
            throw "not a zip: expected PK local-file header 50-4B-03-04, got $shown"
          }

          $listing = & $seven l -ba $zipPath
          if ($LASTEXITCODE -ne 0) { throw "7z l failed with exit $LASTEXITCODE" }
          $text = ($listing | Out-String)
          foreach ($name in @('datapeek.exe', 'LICENSE', 'README.md')) {
            $fwd = "$stage/$name"
            $bwd = "$stage\$name"
            if (($text -notlike "*$fwd*") -and ($text -notlike "*$bwd*")) {
              throw "archive listing is missing $fwd`n$text"
            }
          }

          Remove-Item -Recurse -Force "dist/$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/datapeek-*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -la dist
          test -f "dist/datapeek-${tag}-aarch64-apple-darwin.tar.gz"
          test -f "dist/datapeek-${tag}-x86_64-apple-darwin.tar.gz"
          test -f "dist/datapeek-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          test -f "dist/datapeek-${tag}-x86_64-pc-windows-msvc.zip"

      # Notes live outside dist/ so the asset globs below do not upload them.
      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-notes
          awk -v version="$version" '
            BEGIN { heading = "## [" version "]" }
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > dist-notes/RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' dist-notes/RELEASE_NOTES.md; then
            echo "No CHANGELOG section for ${version}" >&2
            exit 1
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist-notes/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/datapeek-*.tar.gz
            dist/datapeek-*.zip
