name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    name: aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package
        run: |
          STAGE=datapeek-aarch64-apple-darwin
          mkdir -p dist/$STAGE
          cp target/aarch64-apple-darwin/release/datapeek dist/$STAGE/
          cp README.md LICENSE dist/$STAGE/
          tar -C dist -czf dist/$STAGE.tar.gz $STAGE
          shasum -a 256 dist/$STAGE.tar.gz | tee dist/$STAGE.sha256

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/datapeek-aarch64-apple-darwin.tar.gz
            dist/datapeek-aarch64-apple-darwin.sha256
