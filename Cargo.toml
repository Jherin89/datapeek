[package]
name = "datapeek"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
authors = ["Jordan Herin"]
license = "MIT"
description = "Instant data-file profiler for CSV, TSV, Parquet, JSON Lines, and Excel"
readme = "README.md"
repository = "https://github.com/Jherin89/datapeek"
homepage = "https://github.com/Jherin89/datapeek"
keywords = ["csv", "parquet", "excel", "cli", "profiler"]
categories = ["command-line-utilities", "data-structures"]
exclude = ["target", "*.csv.bak"]

[dependencies]
calamine = { version = "0.37", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
csv = "1.3"
polars = { version = "0.46", default-features = false, features = [
    "csv",
    "dtype-date",
    "dtype-datetime",
    "json",
    "lazy",
    "parquet",
    "strings",
    "temporal",
] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rust_xlsxwriter = "0.99"
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "datapeek"
path = "src/main.rs"
